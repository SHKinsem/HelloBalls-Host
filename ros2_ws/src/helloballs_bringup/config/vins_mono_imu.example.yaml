%YAML:1.0
---
image0_topic: /camera/image_raw
image1_topic: ""
imu_topic: /imu/data_raw
output_path: /tmp

imu: 1
num_of_cam: 1
image_width: 800
image_height: 592
cam0_calib: helloballs_camera_pinhole.example.yaml

estimate_extrinsic: 0
# imu_link/body uses vehicle axes (x forward, y left, z up), while the camera
# model uses optical axes (x right, y down, z forward).
body_T_cam0:
   rows: 4
   cols: 4
   dt: d
   data: [0.0, 0.0, 1.0, 0.16342,
          -1.0, 0.0, 0.0, 0.063,
          0.0, -1.0, 0.0, 0.03555,
          0.0, 0.0, 0.0, 1.0]

acc_n: 0.0
gyr_n: 0.0
acc_w: 0.0
gyr_w: 0.0
g_norm: 9.80665

estimate_td: 0
td: 0.0

max_cnt: 150
min_dist: 30
freq: 10
F_threshold: 1.0
show_track: 1
flow_back: 1

multiple_thread: 1
max_solver_time: 0.04
max_num_iterations: 8
keyframe_parallax: 10.0
